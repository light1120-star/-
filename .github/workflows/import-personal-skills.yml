name: Import personal skills
on:
  push:
    paths:
      - .github/workflows/import-personal-skills.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-personal-skills
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand and validate personal skills
        run: python .skill-import/import_skills.py
      - name: Commit named skill folders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills README.md AGENTS.md SKILLS-CATALOG.json SKILLS-FILES.json
          git rm .skill-import/skills-part-*.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install 42 personal skills in folders named after each skill"
          git push origin HEAD:main


# Import archives verified and ready.
